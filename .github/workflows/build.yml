name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: ./tools/setup-deps.ps1 -BuildOnly
      - shell: pwsh
        run: ./build.ps1
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: FrameLab-experimental-windows-x64-no-nvidia-runtime
          path: |
            app/FrameLab.exe
            app/FrameLabPixels.dll
            app/FrameLab-Setup.exe
            app/nr-host/nvngx.dll
            THIRD_PARTY_NOTICES.md
            website/assets/fonts/*OFL.txt
