function render(){document.documentElement.lang=cs?'cs':'en';$('lang').textContent=t('Čeština','English');$('title').textContent=t('Q3 or Q8 while frame gen is running?','Q3, nebo Q8 při běžícím frame genu?');const q3=data[keys[0]],q8=data[keys[1]],saved=100*(1-q3.paced_latency_ms.median/q8.paced_latency_ms.median);$('intro').textContent=t(`On this desktop, Q3 translation took ${fmt(saved)}% less time at the median. The same 300 sentences showed no clear quality advantage for Q8. Start with Q3; Q8 remains an optional comparison.`,`Na tomto PC zabral překlad Q3 v mediánu o ${fmt(saved)} % méně času. Stejných 300 vět neukázalo jasnou kvalitativní výhodu Q8. Začněte Q3; Q8 zůstává volitelnou alternativou pro porovnání.`);$('scope').textContent=t('Exact-text inference alongside running VFG, NR and CPU OCR. These are model request times and software output counters, not full subtitle delay or physically measured monitor FPS.','Překlad přesného textu při současně běžícím VFG, NR a CPU OCR. Jde o dobu požadavku modelu a softwarové čítače výstupu, nikoli celé zpoždění titulků nebo fyzicky změřené FPS monitoru.');$('cards').replaceChildren();for(const [i,k] of keys.entries()){const card=el('article','');card.className='card';const n=el('div',fmt(data[k].paced_latency_ms.median,0)+' ms');n.className='big';card.append(el('h2',i?'CUNI-MH Q8_0':'CUNI-MH Q3_K_M'),n,el('p',t('Median translation · 180 paced requests','Medián překladu · 180 periodických požadavků')));$('cards').append(card)}$('resultTitle').textContent=t('Measured alongside processing','Naměřeno při zpracování obrazu');$('metric').textContent=t('Metric','Metrika');$('metrics').replaceChildren();const metrics=[[t('Translation p95','Překlad p95'),r=>fmt(r.paced_latency_ms.p95,0)+' ms'],[t('Requests above 2 seconds','Požadavky nad 2 sekundy'),r=>r.paced_over_2s+' / 180'],[t('Output during paced translation','Výstup při periodickém překladu'),r=>fmt(r.active_mean_fps)+' fps'],[t('Adjacent unloaded controls','Sousední kontroly bez GPU modelu'),r=>fmt(r.control_mean_fps)+' fps'],[t('Output change vs own controls','Změna výstupu proti vlastním kontrolám'),r=>fmt(r.fps_change_mean_percent)+' %'],[t('Whole-GPU utilization, paced mean','Vytížení celé GPU, periodický průměr'),r=>fmt(r.paced_gpu_mean_percent)+' %'],[t('Whole-GPU power, paced mean','Příkon celé GPU, periodický průměr'),r=>fmt(r.paced_power_mean_w)+' W'],[t('Extra memory with model resident','Paměť navíc s načteným modelem'),r=>fmt(r.resident_extra_mib/1024,2)+' GiB'],[t('Minimum free memory across phases','Nejméně volné paměti napříč fázemi'),r=>fmt(r.minimum_free_mib/1024,2)+' GiB']];for(const [label,value] of metrics){const tr=el('tr','');tr.append(el('th',label),...keys.map(k=>el('td',value(data[k]))));$('metrics').append(tr)}$('units').textContent=t('NVML whole-device samples at 1 Hz. Phase summaries omit the first 5 and last 2 seconds; request latencies use every completed request. Memory uses binary GiB, excluding reserved memory.','NVML vzorkuje celou kartu 1× za sekundu. Souhrny fází vynechávají prvních 5 a poslední 2 sekundy; latence zahrnují všechny dokončené požadavky. Paměť v binárních GiB, bez rezervované paměti.');$('qualityTitle').textContent=t('300 sentences, both quantizations','300 vět, obě kvantizace');$('qualityText').textContent=t('271/300 acceptable for each model; major errors: Q3 2, Q8 5. Q8 scored higher in 17 cases and lower in 16. All concurrent outputs match the separately reviewed text-only preflight after trimming surrounding whitespace. Grades are assistant judgments, not a blinded independent human study.','Oba modely: 271/300 přijatelných; zásadní chyby: Q3 2, Q8 5. Q8 získal vyšší známku v 17 případech a nižší v 16. Všechny výstupy souběžného běhu odpovídají samostatně hodnocenému předběžnému testu po odstranění okolních mezer. Známky určil asistent, nejde o slepý nezávislý lidský test.');$('qualityLink').textContent=t('Inspect all 300 pairs →','Prohlédnout všech 300 párů →');$('qualityLink').href='quality/report.html'+(cs?'?lang=cs':'');$('methodTitle').textContent=t('Setup and method','Sestava a postup');$('method').textContent=t('Ryzen 9 5900X, 64 GB RAM, RTX 5070 Ti 16 GB, driver 617.14, Windows 11 Pro. Unmodified preview.12 played the same 1080p30 CS:GO loop with VFG 2× Medium, experimental NR 65% / 720p and the existing CPU OCR pipeline enabled. CUNI requests used a separate local Ollama 0.40.16 process with verified full GPU offload. The capture card was not used; no game was rendered on this GPU.','Ryzen 9 5900X, 64 GB RAM, RTX 5070 Ti 16 GB, ovladač 617.14, Windows 11 Pro. Neupravená preview.12 přehrávala stejnou 1080p30 smyčku CS:GO s VFG 2× Medium, experimentálním NR 65 % / 720p a zapnutou původní CPU OCR cestou. CUNI požadavky zpracoval samostatný lokální Ollama 0.40.16 s ověřeným plným načtením do GPU. Střihovka nebyla použita; na GPU se nerenderovala hra.');$('protocol').textContent=t('For each model: 60 s unloaded baseline, warmup, 30 s resident idle, 300 back-to-back translations, then three 60-request cycles spaced at least 2 s apart. Each cycle has its own 60 s unloaded controls before and after. The same fixed corpus and prompt were used for Q3 and Q8; references were never supplied to the model. Raw phases, individual requests and telemetry are linked below.','Pro každý model: 60 s kontrola bez modelu, zahřátí, 30 s načtený nečinný model, 300 překladů za sebou a tři cykly po 60 požadavcích s odstupem alespoň 2 s. Každý cyklus má vlastní 60s kontroly bez modelu před i po něm. Q3 a Q8 dostaly stejný korpus i prompt; reference model nikdy neviděl. Níže jsou surové fáze, požadavky a telemetrie.');$('limits').textContent=t('This controlled benchmark kept the baseline CPU OCR path active; it did not time the new integrated CUNI subtitle pipeline end to end. Separate real-image integration tests cover that path. Results depend on input resolution, frame-gen multiplier, enhancer settings, other GPU work and OCR readability. Higher quantization is not a guarantee of better translation.','Řízený benchmark nechal běžet původní CPU OCR cestu; neměřil celkové zpoždění nových integrovaných CUNI titulků. Tuto cestu ověřují samostatné testy se skutečným OCR z obrazu. Výsledek závisí na rozlišení, násobiči frame genu, enhanceru, další práci GPU a čitelnosti textu. Vyšší kvantizace nezaručuje lepší překlad.');$('cycles').replaceChildren();for(const [i,k] of keys.entries()){const d=el('details','');d.append(el('summary',(i?'Q8':'Q3')+t(' · individual cycles and raw evidence',' · jednotlivé cykly a surová data')));for(const c of data[k].paired_cycles)d.append(el('p',t('Cycle ','Cyklus ')+c.cycle+': '+fmt(c.control_fps)+' → '+fmt(c.active_fps)+' fps ('+fmt(c.change_percent)+' %)'));const links=el('p','');links.className='links';for(const [file,label] of [['phases.json',t('Phases','Fáze')],['app-telemetry.csv','App CSV'],['quality-300-results.jsonl',t('300 requests','300 požadavků')],['paced-1-gpu.jsonl','GPU 1'],['paced-2-gpu.jsonl','GPU 2'],['paced-3-gpu.jsonl','GPU 3']]){const a=el('a',label);a.href='data/'+k+'/'+file;links.append(a)}d.append(links);$('cycles').append(d)}$('rights').textContent=t('Game text, source licenses, model cards and attribution are retained in the quality report. No model weights or private NR libraries are included. Original notebook results remain separate.','Herní texty, licence zdrojů, modelové karty a autorství jsou zachovány v reportu kvality. Balík neobsahuje modelové váhy ani soukromé NR knihovny. Původní notebookové výsledky zůstávají oddělené.');$('guide').textContent=t('Subtitle setup guide','Návod k titulkům');$('guide').href='https://opicebot.cz/framelab/guide/'+(cs?'subtitles.html':'subtitles-en.html')}
addEventListener('framelab:language',e=>{cs=e.detail.language==='cs';render()});render();</script></html>
